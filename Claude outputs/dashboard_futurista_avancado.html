<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Futurista - Exemplo Avançado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #070B18;
            color: #F5F7FF;
            margin: 0;
            padding: 0;
            perspective: 1000px;
        }
        .header {
            background-color: rgba(0, 229, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            box-shadow: 0 0 20px #00E5FF;
            padding: 20px;
            text-align: center;
            margin: 20px;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
            transform-style: preserve-3d;
        }
        .card {
            background-color: rgba(19, 29, 53, 0.5);
            border-radius: 10px;
            box-shadow: 0 0 15px #FF3CAC;
            margin: 15px;
            flex: 1 1 300px;
            max-width: 300px;
            padding: 20px;
            transform: translateZ(30px);
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .card:hover {
            transform: translateZ(50px);
            box-shadow: 0 0 30px #FF3CAC;
        }
        .card h2 {
            color: #FF3CAC;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard Futurista</h1>
    </div>
    <div class="container">
        <div class="card">
            <h2>Clientes</h2>
            <p>120</p>
        </div>
        <div class="card">
            <h2>Emprestado</h2>
            <p>R$ 85.000</p>
        </div>
        <div class="card">
            <h2>Em atraso</h2>
            <p>8</p>
        </div>
    </div>
</body>
</html>
