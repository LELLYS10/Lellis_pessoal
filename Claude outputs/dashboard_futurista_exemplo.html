<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Futurista - Exemplo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #070B18;
            color: #F5F7FF;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #00E5FF;
            padding: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin: 20px;
        }
        .card {
            background-color: #131D35;
            border-radius: 8px;
            margin: 10px;
            flex: 1 1 300px;
            max-width: 300px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
        }
        .card h2 {
            color: #FF3CAC;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Dashboard Futurista</h1>
    </div>
    <div class="container">
        <div class="card">
            <h2>Clientes</h2>
            <p>120</p>
        </div>
        <div class="card">
            <h2>Emprestado</h2>
            <p>R$ 85.000</p>
        </div>
        <div class="card">
            <h2>Em atraso</h2>
            <p>8</p>
        </div>
    </div>
</body>
</html>
